name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install testing and coverage tools
        run: |
          python -m pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests --cov=src --cov-report=term-missing --cov-report=xml

      - name: Enforce minimum coverage threshold
        run: |
          coverage report --fail-under=80

      - name: Extract coverage metrics
        id: coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          percent = round(line_rate * 100, 2)
          print(f"coverage={percent}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as f:
              f.write(f"coverage={percent}\n")
          PY

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const body = `## Coverage Report

            Total coverage: **${coverage}%**

            This PR is currently above the required minimum threshold.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });